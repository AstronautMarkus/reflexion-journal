{% extends 'base/base.html' %}
{% block title %}Cambiar Contraseña - Reflexion Journal{% endblock %}
{% block content %}
<div class="text-center" style="margin-bottom: 18px;">
    <h1><i class="fa-solid fa-lock"></i> Cambiar Contraseña</h1>
    <p>Para cambiar tu contraseña, solicita un código de verificación por email.</p>
</div>

<div class="form-narrow">
    <form method="POST" action="{{ url_for('settings.send_change_password_code') }}">
        <div class="form-group text-center">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-envelope"></i> Enviar código de cambio de contraseña
            </button>
            <br><br>
            <a href="{{ url_for('settings.settings_page') }}" class="btn btn-default">
                <i class="fa-solid fa-arrow-left"></i> Volver a Configuración
            </a>
        </div>
    </form>
</div>
{% endblock %}
