{% extends 'base/base.html' %}
{% block title %}Definir Día Cero - Reflexion Journal{% endblock %}

{% block content %}
<div class="container">
  <div class="row">
    <div class="col-md-4 col-md-offset-4">
      <form method="post">
        <div class="form-group">
          <label for="day_zero">Selecciona el Día Cero:</label>
          <input type="date" class="form-control" id="day_zero" name="day_zero" required>
        </div>
        <button type="submit" class="btn btn-primary">Guardar</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
