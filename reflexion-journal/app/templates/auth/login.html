{% extends 'base/base.html' %}
{% block title %}Iniciar sesión - Reflexion Journal{% endblock %}
{% block content %}
<div class="text-center" style="margin-bottom: 18px;">
    <h1><i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar sesión</h1>
    <p><strong>Por favor, ingresa tus credenciales para acceder a tu cuenta.</strong></p>
</div>

<div class="form-narrow">
    <form method="POST" action="{{ url_for('auth.login') }}">
        <div class="form-group">
            <label for="email" class="control-label">Email <i class="text-danger">*</i></label>
            <div class="input-group">
                <span class="input-group-addon"><i class="fa-solid fa-envelope"></i></span>
                <input type="email" class="form-control" name="email" id="email" required placeholder="Ej. juan@email.com">
            </div>
        </div>
        <div class="form-group">
            <label for="password" class="control-label">Contraseña <i class="text-danger">*</i></label>
            <div class="input-group">
                <span class="input-group-addon"><i class="fa-solid fa-lock"></i></span>
                <input type="password" class="form-control" name="password" id="password" required placeholder="Tu contraseña">
                <span class="input-group-btn">
                    <button class="btn btn-default toggle-password" type="button" data-target="password" tabindex="-1">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </span>
            </div>
        </div>
        <div class="form-group text-center">
            <label class="checkbox">
                <input type="checkbox" name="remember" id="remember"> Recuérdame
            </label>
        </div>
        <div class="form-group text-center">
            <button type="submit" class="btn btn-primary">
                <i class="fa-solid fa-arrow-right-to-bracket"></i> Iniciar sesión
            </button>
            <br><br>
            <a href="{{ url_for('main.home') }}" class="btn btn-link">
                <i class="fa-solid fa-house"></i> Volver a la página principal
            </a>
        </div>
    </form>
    <p class="text-center">
        <a href="{{ url_for('auth.register') }}">¿No tienes una cuenta? Regístrate aquí</a>
    </p>
</div>
{% endblock %}
